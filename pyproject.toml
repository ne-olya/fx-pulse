[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fx-pulse"
version = "0.1.0"
description = "Signals for favorable cross-border transfer moments"
requires-python = ">=3.12"
dependencies = [
    "arch>=7.2,<8",
    "catboost>=1.2.8,<2",
    "certifi>=2025.8.3,<2027",
    "holidays>=0.80,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "xgboost>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fxpulse"]
